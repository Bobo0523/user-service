name: Spring Boot CI/CD

on:
  push:
    branches:
      - main
      - cognito
jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Build Project
        run: mvn clean package
  docker:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest
  
  deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: script on ec2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PEM_KEY }}
          script: |
            set -e
            if ! command -v docker &> /dev/null; then
                sudo apt-get update
                sudo apt-get install -y docker.io
                sudo systemctl start docker
                sudo systemctl enable docker
            else
                echo "Docker installed。"
            fi

            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
 
            echo "SPRING_PROFILES_ACTIVE=prod" > .env
            echo "COGNITO_URI=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_FntgOkEnY" >> .env
            
            sudo docker stop user-app || true
            sudo docker rm user-app || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/user-service:latest

            sudo docker run -d --name user-app -p 8080:8080 --env-file .env ${{ secrets.DOCKER_USERNAME }}/user-service:latest

           
