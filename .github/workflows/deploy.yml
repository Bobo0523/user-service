name: Spring Boot CI/CD

# ==========================
# 触发条件
# ==========================
on:
  push:
    branches:
      - main
      - cognito
jobs:

  # ==========================
  # Job1：Build
  # ==========================
  build:

    runs-on: ubuntu-latest

    steps:

      # 下载GitHub仓库代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 安装Java 17
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Maven缓存，加快编译速度
      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      # 编译并运行JUnit测试
      - name: Build Project
        run: mvn clean package

  # ==========================
  # Job2：Docker
  # ==========================
  docker:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 登录Docker Hub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 构建Docker镜像
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest .

      # 推送镜像
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

  # ==========================
  # Job3：Deploy
  # ==========================
  deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      # SSH登录EC2并执行部署脚本
      - name: 3. 在 EC2 上执行终极自动化脚本
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # --- 阶段 A：自动化环境准备 (如果已装 Docker 会自动跳过) ---
            echo "🔥 检查并安装 Docker 环境..."
            if ! command -v docker &> /dev/null; then
                sudo apt-get update
                sudo apt-get install -y docker.io
                sudo systemctl start docker
                sudo systemctl enable docker
            else
                echo "Docker 已安装，跳过。"
            fi

            # --- 阶段 B：动态生成 .env 环境变量文件 ---
            echo "📝 正在生成 .env 配置文件..."
            cd /home/ubuntu/app
            
            # 使用 cat 结合 EOF 语法，直接在服务器上凭空写出一个 .env 文件
            # 里面的值可以从 GitHub Secrets 读，也可以直接写死
            cat <<EOF > .env
            SPRING_PROFILES_ACTIVE=prod
            COGNITO_URI=https://cognito-idp.ap-southeast-2.amazonaws.com/你的_USER_POOL_ID

            # --- 阶段 C：构建与运行 ---
            echo "🧹 清理旧容器 (即使不存在也不会报错)..."
            sudo docker stop user-app || true
            sudo docker rm user-app || true

            echo "🔨 开始根据最新的代码构建 Docker 镜像..."
            sudo docker build -t user-service-image .

            echo "🚀 启动新容器，并注入刚才生成的 .env 配置文件..."
            sudo docker run -d --name user-app -p 8080:8080 --env-file .env user-service-image

            echo "✅ 部署完美结束！"
